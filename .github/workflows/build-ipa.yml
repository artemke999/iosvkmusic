name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project VKMusicStudio.xcodeproj \
            -scheme VKMusicStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package VKMusicStudio.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VKMusicStudio.app Payload/
          zip -qry VKMusicStudio.ipa Payload
          ls -lh VKMusicStudio.ipa

      - name: Upload VKMusicStudio.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: VKMusicStudio-ipa
          path: VKMusicStudio.ipa
